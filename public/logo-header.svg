<svg viewBox="0 0 620 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chromeH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf2ff"/>
      <stop offset="28%" stop-color="#7fa8e0"/>
      <stop offset="52%" stop-color="#1c3f7a"/>
      <stop offset="72%" stop-color="#7fa8e0"/>
      <stop offset="100%" stop-color="#16305e"/>
    </linearGradient>
    <linearGradient id="waterH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6f97c8"/>
      <stop offset="55%" stop-color="#1c3f7a"/>
