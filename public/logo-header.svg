  </g>

  <text x="160" y="60" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="900"
        fill="url(#chromeH)" stroke="#0c1e3d" stroke-width="1.8" letter-spacing="1"
        transform="skewX(-6)">COMPLETE</text>
  <text x="160" y="98" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="900"
